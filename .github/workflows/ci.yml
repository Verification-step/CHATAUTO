name: CI

on:
  push:
    branches: [main, feature/local-agent-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run compile
      - run: npm test
      - run: npx @vscode/vsce package --no-dependencies
